<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="DeepResearch 多智能体编排示意图">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F8FC"/><stop offset="1" stop-color="#E7EDF7"/>
    </linearGradient>
    <pattern id="ddots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#C6CFE0" opacity=".55"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#dbg)"/>
  <rect width="640" height="400" fill="url(#ddots)"/>

  <!-- orbit -->
  <circle cx="320" cy="200" r="118" fill="none" stroke="#C3CEE2" stroke-width="1.2" stroke-dasharray="4 5"/>

  <!-- satellites -->
  <g>
    <rect x="128" y="86" width="112" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2EE"/>
    <circle cx="150" cy="112" r="8" fill="#EDF1FA"/>
    <rect x="166" y="102" width="54" height="7" rx="3.5" fill="#D5DEEF"/>
    <rect x="166" y="116" width="38" height="6" rx="3" fill="#EDF1F8"/>

    <rect x="400" y="86" width="112" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2EE"/>
    <circle cx="422" cy="112" r="8" fill="#EDF1FA"/>
    <rect x="438" y="102" width="58" height="7" rx="3.5" fill="#D5DEEF"/>
    <rect x="438" y="116" width="34" height="6" rx="3" fill="#EDF1F8"/>

    <rect x="128" y="262" width="112" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2EE"/>
    <circle cx="150" cy="288" r="8" fill="#EDF1FA"/>
    <rect x="166" y="278" width="48" height="7" rx="3.5" fill="#D5DEEF"/>
    <rect x="166" y="292" width="60" height="6" rx="3" fill="#EDF1F8"/>

    <rect x="400" y="262" width="112" height="52" rx="12" fill="#FFFFFF" stroke="#DCE2EE"/>
    <circle cx="422" cy="288" r="8" fill="#EDF1FA"/>
    <rect x="438" y="278" width="52" height="7" rx="3.5" fill="#D5DEEF"/>
    <rect x="438" y="292" width="42" height="6" rx="3" fill="#EDF1F8"/>
  </g>

  <!-- connectors -->
  <g stroke="#C3CEE2" stroke-width="1.2" fill="none">
    <path d="M240,118 L282,158"/>
    <path d="M400,118 L358,158"/>
    <path d="M240,282 L282,242"/>
    <path d="M400,282 L358,242"/>
  </g>

  <!-- hub -->
  <circle cx="320" cy="200" r="60" fill="#EDF1FA"/>
  <circle cx="320" cy="200" r="44" fill="#FFFFFF" stroke="#DCE2EE"/>
  <g stroke="#2A4FD7" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M306,192 h28"/>
    <path d="M306,202 h20"/>
    <path d="M306,212 h24"/>
  </g>

  <!-- numbered loop hints -->
  <g font-family="monospace" font-size="11" fill="#8B99B5">
    <text x="330" y="80">01</text>
    <text x="470" y="200">02</text>
    <text x="330" y="330">03</text>
    <text x="150" y="200">04</text>
  </g>

  <!-- draft sheet -->
  <g>
    <rect x="498" y="316" width="96" height="56" rx="8" fill="#FFFFFF" stroke="#DCE2EE"/>
    <path d="M572,316 l22,22 h-22 z" fill="#EDF1F8" stroke="#DCE2EE"/>
    <rect x="512" y="332" width="52" height="6" rx="3" fill="#DDE4F1"/>
    <rect x="512" y="344" width="40" height="6" rx="3" fill="#EDF1F8"/>
    <rect x="512" y="356" width="56" height="6" rx="3" fill="#EDF1F8"/>
  </g>
</svg>
